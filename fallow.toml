# Fallow: dead code, circular deps, duplication, complexity, architecture boundaries.
# Docs: https://docs.fallow.tools

entry = [
  "src/index.ts",
  "src/cli.ts",
  "src/**/*.test.ts",
  "test/**/*.test.ts",
]

# examples/ holds sample configs and task workspaces handed to a builder, not
# part of volley's module graph; several are deliberately incomplete (a test
# importing the module the builder is asked to write).
ignorePatterns = ["examples/**"]

# CLI/build tooling: invoked via package scripts or by checkride's adapters,
# never imported from source, so fallow can't see the usage. `ai`,
# `ai-sdk-ollama`, and `@agentclientprotocol/sdk` are fascicle peers: fascicle
# loads them, volley's source never imports them (only the ACP tests import the
# SDK, for its client). volley also declares ai-sdk-ollama's 4.3.0 floor as its
# own optional peer, the release that streams a thinking model's reasoning
# unasked.
ignoreDependencies = ["@agentclientprotocol/sdk", "@ast-grep/cli", "ai", "ai-sdk-ollama"]

[rules]
unused-exports = "error"
unused-files = "error"
unused-dependencies = "error"
circular-dependencies = "error"
boundary-violation = "error"

[duplicates]
mode = "mild"
minTokens = 50

[health]
maxCyclomatic = 15
maxCognitive = 15
