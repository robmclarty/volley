name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push to a PR supersedes its in-flight run; pushes to
# main queue instead of cancelling, so every landed commit gets a full verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Version comes from the root package.json `packageManager` field, so CI
      # uses the exact pnpm that wrote the lockfile and reads workspace overrides.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full checkride gate volley dogfoods: types, lint, struct, dead, test,
      # links. Live tests (VOLLEY_LIVE) and the real-Docker sandbox test (needs
      # the volley-sandbox image) gate themselves off on a hosted runner.
      - name: Check suite
        run: pnpm check
      - name: Build
        run: pnpm build
      # A failing slot prints only its status line; the tool output that says
      # *what* broke lives in .check/, which a hosted runner discards.
      - name: Failing check output
        if: failure()
        run: |
          [ -d .check ] || exit 0
          failed=$(node -e '
            const s = require("./.check/summary.json");
            console.log(s.checks.filter(c => c.ok === false).map(c => c.name).join(" "));
          ' 2>/dev/null) || failed=""
          echo "failing slots: ${failed:-<none recorded>}"
          for slot in $failed; do
            for f in ".check/$slot.stdout.txt" ".check/$slot.stderr.txt"; do
              [ -s "$f" ] || continue
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            done
          done
      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports
          path: |
            .check/
            !.check/coverage/**
          retention-days: 14
          if-no-files-found: ignore
