id: orchestrator-no-loops
message: |
  The iteration loop is fascicle's `loop` (spec §7/§10). The orchestrator must
  not hand-write `while` / `for` / `do` iteration constructs.
severity: error
language: typescript
files:
  - '**/src/orchestrator.ts'
rule:
  any:
    - kind: while_statement
    - kind: for_statement
    - kind: for_in_statement
    - kind: do_statement
