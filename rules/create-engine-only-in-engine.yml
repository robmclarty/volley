id: create-engine-only-in-engine
message: |
  `create_engine` may appear in exactly one file, `src/engine.ts` (spec §7/§10).
  Every other module imports the ready-made `Engine` from `./engine.js`.
severity: error
language: typescript
files:
  - '**/src/**/*.ts'
ignores:
  - '**/src/engine.ts'
rule:
  pattern: create_engine
