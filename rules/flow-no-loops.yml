id: flow-no-loops
message: |
  Iteration belongs to the flow's fascicle `loop` (src/flow.ts). The flow, its
  step bodies, and the shell around it must not hand-write `while` / `for` /
  `do` iteration constructs.
severity: error
language: typescript
files:
  - '**/src/flow.ts'
  - '**/src/phases.ts'
  - '**/src/orchestrator.ts'
rule:
  any:
    - kind: while_statement
    - kind: for_statement
    - kind: for_in_statement
    - kind: do_statement
